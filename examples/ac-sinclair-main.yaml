# DO NOT COMPILE
# THIS IS INCLUDE ONLY FILE
esphome:
  name: $deviceid

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Enable logging
logger:
  baud_rate: 0 # disable LOG output on UART as UART is used for Sinclair AC unit
  # level: VERBOSE

# Example configuration entry
status_led:
    pin: 
      number: GPIO10
      inverted: true

uart:
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 4800
  parity: EVEN

time:
  - platform: sntp

external_components:
  - source: github://piotrva/esphome_gree_ac
    components: [sinclair_ac]
    refresh: 0s

climate:
  - platform: sinclair_ac
    name: ${devicename}
    # Custom protocol debug UI served by the AC component itself.
    debug_ui: true
    debug_ui_port: 8080
    horizontal_swing_select:
      name: ${devicename} Horizontal Swing Mode
    vertical_swing_select:
      name: ${devicename} Vertical Swing Mode
    display_select:
      name: ${devicename} Display Mode
    display_unit_select:
      name: ${devicename} Display Unit
    plasma_switch:
      name: ${devicename} Plasma
    sleep_switch:
      name: ${devicename} Sleep
    xfan_switch:
      name: ${devicename} X-fan
    save_switch:
      name: ${devicename} Save|8 Heat

wifi:
  # Normal Wi-Fi connection. When this connects, open the debug UI at:
  #   http://<device-ip>:8080/
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback hotspot. If normal Wi-Fi fails, the ESP starts this AP instead.
  # Then open the debug UI at:
  #   http://192.168.4.1:8080/
  ap:
    ssid: ${devicename} Fallback Hotspot
    password: !secret wifi_ap_passwd
    