# Shared Gree Lomo ESP-01 configuration.
# Include this file from a device-specific YAML that supplies substitutions,
# Home Assistant API settings, and OTA credentials.

esphome:
  name: ${deviceid}
  friendly_name: ${devicename}

esp8266:
  board: esp01_1m

logger:
  baud_rate: 0  # UART is connected to the AC unit

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    ssid: ${devicename} Fallback
    password: !secret wifi_ap_passwd

uart:
  tx_pin: 1
  rx_pin: 3
  baud_rate: 4800
  parity: EVEN

external_components:
  - source:
      type: local
      path: ../components
    components: [sinclair_ac]

climate:
  - platform: sinclair_ac
    name: ${devicename}
